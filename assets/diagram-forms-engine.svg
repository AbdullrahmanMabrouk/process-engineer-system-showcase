<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" role="img" aria-label="Fourteen hand-built forms means fourteen render, submit, print and draft paths. Fourteen schemas through one engine means one of each.">
  <style>
    .bg   { fill: #faf7f2; }
    .card { fill: #ffffff; stroke: #d9d2c7; stroke-width: 1.5; }
    .t    { font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; fill: #231f1b; }
    .h    { font-family: "Barlow Semi Condensed", "Segoe UI Semibold", system-ui, sans-serif; font-weight: 800; letter-spacing: .04em; }
    .lbl  { font-size: 11px; fill: #6b645b; letter-spacing: .07em; text-transform: uppercase; font-weight: 700; }
    .sub  { font-size: 12.5px; fill: #6b645b; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 11px; }
    .bad  { stroke: #b3341f; }
    .good { stroke: #1b7f4b; }
    .wbad { stroke: #d99a8c; stroke-width: 1.1; fill: none; }
    .wgood{ stroke: #1b7f4b; stroke-width: 1.6; fill: none; }
    .divider { stroke: #ddd5c9; stroke-width: 1.5; stroke-dasharray: 5 5; }
  </style>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" style="fill:#1b7f4b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="520"/>
  <text class="t h" x="34" y="42" font-size="19">WHY THE FORMS ARE DATA</text>

  <line class="divider" x1="490" y1="66" x2="490" y2="492"/>

  <!-- LEFT: the naive build -->
  <text class="t lbl" x="34" y="92" style="fill:#b3341f">The obvious build</text>
  <text class="t sub" x="34" y="112">One form, hand-coded. Then another. Then twelve more.</text>

  <g>
    <rect class="card bad" x="34" y="134" width="92" height="30" rx="6"/>
    <text class="t mono" x="48" y="153">pds_str</text>
    <rect class="card bad" x="34" y="172" width="92" height="30" rx="6"/>
    <text class="t mono" x="48" y="191">pds_cv</text>
    <rect class="card bad" x="34" y="210" width="92" height="30" rx="6"/>
    <text class="t mono" x="48" y="229">pds_ex</text>
    <text class="t sub" x="48" y="256" style="fill:#9c948a">...11 more</text>
  </g>

  <path class="wbad" d="M126 149 H190"/>
  <path class="wbad" d="M126 187 H190"/>
  <path class="wbad" d="M126 225 H190"/>
  <path class="wbad" d="M126 149 H158 V225"/>

  <g>
    <rect class="card bad" x="190" y="132" width="252" height="34" rx="6"/>
    <text class="t sub" x="204" y="154">render path &#215;14</text>
    <rect class="card bad" x="190" y="174" width="252" height="34" rx="6"/>
    <text class="t sub" x="204" y="196">submit path &#215;14</text>
    <rect class="card bad" x="190" y="216" width="252" height="34" rx="6"/>
    <text class="t sub" x="204" y="238">print stylesheet &#215;14</text>
    <rect class="card bad" x="190" y="258" width="252" height="34" rx="6"/>
    <text class="t sub" x="204" y="280">drafts, nav, history &#215;14</text>
  </g>

  <rect x="34" y="320" width="408" height="76" rx="9" fill="#fbeeea" stroke="#e8c3b8"/>
  <text class="t sub" x="52" y="346" font-weight="700" style="fill:#b3341f">A bug fixed in one is fixed in one.</text>
  <text class="t sub" x="52" y="366">The first two departments really were built this way.</text>
  <text class="t sub" x="52" y="384">That is how the problem was found.</text>

  <!-- RIGHT: schema-driven -->
  <text class="t lbl" x="530" y="92" style="fill:#1b7f4b">What shipped</text>
  <text class="t sub" x="530" y="112">The form is a declaration. The engine is the only code.</text>

  <g>
    <rect class="card good" x="530" y="134" width="104" height="30" rx="6"/>
    <text class="t mono" x="544" y="153">pds_str</text>
    <rect class="card good" x="530" y="172" width="104" height="30" rx="6"/>
    <text class="t mono" x="544" y="191">pds_cv</text>
    <rect class="card good" x="530" y="210" width="104" height="30" rx="6"/>
    <text class="t mono" x="544" y="229">pds_ex</text>
    <text class="t sub" x="544" y="256" style="fill:#9c948a">...11 more</text>
    <text class="t sub" x="530" y="286" font-style="italic">14 schemas</text>
  </g>

  <path class="wgood" marker-end="url(#g)" d="M634 149 Q680 149 680 188 H712"/>
  <path class="wgood" marker-end="url(#g)" d="M634 187 H712"/>
  <path class="wgood" marker-end="url(#g)" d="M634 225 Q680 225 680 188 H712"/>

  <rect class="card good" x="712" y="150" width="234" height="76" rx="9" stroke-width="2.5"/>
  <text class="t lbl" x="730" y="176" style="fill:#1b7f4b">One engine</text>
  <text class="t h" x="730" y="202" font-size="16">renderPdsForm()</text>
  <text class="t sub" x="730" y="219">no department knows its own name</text>

  <path class="wgood" marker-end="url(#g)" d="M829 226 V262"/>

  <g>
    <rect class="card good" x="712" y="262" width="234" height="30" rx="6"/>
    <text class="t sub" x="728" y="282">render &#183; submit &#183; print &#183; drafts</text>
    <rect class="card good" x="712" y="300" width="234" height="30" rx="6"/>
    <text class="t sub" x="728" y="320">history &#183; edit &#183; keyboard nav</text>
  </g>

  <rect x="530" y="356" width="416" height="96" rx="9" fill="#eaf4ee" stroke="#bcd9c8"/>
  <text class="t sub" x="548" y="382" font-weight="700" style="fill:#1b7f4b">A new department is a registry entry.</text>
  <text class="t sub" x="548" y="402">A new field is a line. The simplest schema in the file is</text>
  <text class="t sub" x="548" y="420">header fields plus blocks:[] - and it still gets drafts,</text>
  <text class="t sub" x="548" y="438">printing, edit-in-place and full history, for free.</text>
</svg>
